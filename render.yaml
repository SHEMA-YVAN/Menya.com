# One-click deploy for Render (https://render.com) — FREE TIER
# Deploys MENYA as a SINGLE web service: the Express server builds & serves the
# Vue frontend AND the API together.
#
# How to use:
#   1. Push this repo to GitHub.
#   2. On Render: New + → Blueprint → pick your repo → Apply.
#   3. After first deploy, change ADMIN_PASSWORD + JWT_SECRET in the dashboard.
#
# ⚠️ FREE TIER NOTE: the free plan has NO persistent disk, so the database and
# uploaded files are stored on ephemeral storage. They reset when the service
# restarts or wakes from sleep. The seeded sample content always returns on boot.
# For PERMANENT data, upgrade the service to a paid plan and re-add a "disk:"
# block with DB_PATH=/var/data/data.db and UPLOAD_DIR=/var/data/uploads.

services:
  - type: web
    name: menya
    runtime: node
    plan: free
    # Install frontend + backend deps, then build the frontend
    buildCommand: npm install && npm --prefix server install && npm run build
    # Start the single unified server (serves website + API)
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: CORS_ORIGIN
        value: "*"
      # Auto-generate a strong JWT secret
      - key: JWT_SECRET
        generateValue: true
      # CHANGE THESE in the Render dashboard after first deploy
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        value: menya2026
